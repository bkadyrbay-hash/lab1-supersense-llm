# Catches unused imports/variables and syntax errors in src/ and notebooks/ on every PR.
name: lint
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check src notebooks
